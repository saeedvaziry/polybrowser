[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/polybrowser", "crates/polybrowser-core", "crates/polybrowser-wry"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
polybrowser = { version = "0.1.0", path = "crates/polybrowser", default-features = false }
polybrowser-core = { version = "0.1.0", path = "crates/polybrowser-core" }
polybrowser-wry = { version = "0.1.0", path = "crates/polybrowser-wry" }
polybrowser-cef = { version = "0.1.0", path = "crates/polybrowser-cef" }

cef = { version = "154.5", default-features = false }
dirs = "7"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
plist = "1"
raw-window-handle = { version = "0.6", features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
winit = "0.30"
wry = "0.57"
